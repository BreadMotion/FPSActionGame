name: doxygen-includes
on: [push, pull_request]
jobs:
  doxygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
          doxygen Doxyfile
      - uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: docs/html
