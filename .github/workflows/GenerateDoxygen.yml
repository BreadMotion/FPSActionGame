name: doxygen-pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen & Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Create Doxyfile
        shell: bash
        run: |
          cat > Doxyfile <<'EOF'
          PROJECT_NAME           = FPSActionGame
          OUTPUT_DIRECTORY       = docs
          GENERATE_HTML          = YES
          GENERATE_LATEX         = NO
          QUIET                  = YES

          INPUT                  = Source Plugins
          RECURSIVE              = YES
          FILE_PATTERNS          = *.h *.hpp *.hh *.cpp
          EXCLUDE_PATTERNS       = */Intermediate/* */Binaries/* */DerivedDataCache/* */.git/*

          ENABLE_PREPROCESSING   = YES
          MACRO_EXPANSION        = YES
          EXPAND_ONLY_PREDEF     = YES
          PREDEFINED            += UCLASS(...)=
          PREDEFINED            += USTRUCT(...)=
          PREDEFINED            += UENUM(...)=
          PREDEFINED            += UFUNCTION(...)=
          PREDEFINED            += UPROPERTY(...)=
          PREDEFINED            += UINTERFACE(...)=
          PREDEFINED            += GENERATED_BODY(...)=
          PREDEFINED            += GENERATED_UCLASS_BODY(...)=
          PREDEFINED            += FORCEINLINE=inline
          PREDEFINED            += UE_DEPRECATED(...)=
          PREDEFINED            += check(...)=
          PREDEFINED            += ensure(...)=

          HAVE_DOT               = YES
          DOT_IMAGE_FORMAT       = svg
          INCLUDE_GRAPH          = YES
          INCLUDED_BY_GRAPH      = YES
          DOT_TRANSPARENT        = YES
          DOT_GRAPH_MAX_NODES    = 200
          EOF

      - name: Run Doxygen
        run: doxygen Doxyfile

      - name: Upload HTML to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
