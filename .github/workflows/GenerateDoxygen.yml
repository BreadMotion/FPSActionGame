name: doxygen-includes

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen & Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Create Doxyfile
        shell: bash
        run: |
          cat > Doxyfile <<'EOF'
          # ---- 基本 ----
          PROJECT_NAME           = FPSActionGame
          OUTPUT_DIRECTORY       = docs
          GENERATE_HTML          = YES
          GENERATE_LATEX         = NO
          QUIET                  = YES

          # ---- 入力 ----
          INPUT                  = Source Plugins
          RECURSIVE              = YES
          FILE_PATTERNS          = *.h *.hpp *.hh *.cpp
          EXCLUDE                =
          EXCLUDE_PATTERNS       = */Intermediate/* */Binaries/* */DerivedDataCache/* */.git/*

          # ---- UE マクロを無効化（字句解析用）----
          ENABLE_PREPROCESSING   = YES
          MACRO_EXPANSION        = YES
          EXPAND_ONLY_PREDEF     = YES
          PREDEFINED            += UCLASS(...)=
          PREDEFINED            += USTRUCT(...)=
          PREDEFINED            += UENUM(...)=
          PREDEFINED            += UFUNCTION(...)=
          PREDEFINED            += UPROPERTY(...)=
          PREDEFINED            += UINTERFACE(...)=
          PREDEFINED            += GENERATED_BODY(...)=
          PREDEFINED            += GENERATED_UCLASS_BODY(...)=
          PREDEFINED            += FORCEINLINE=inline
          PREDEFINED            += UE_DEPRECATED(...)=
          PREDEFINED            += check(...)=
          PREDEFINED            += ensure(...)=

          # ---- 依存グラフ ----
          HAVE_DOT               = YES
          DOT_IMAGE_FORMAT       = svg
          INCLUDE_GRAPH          = YES
          INCLUDED_BY_GRAPH      = YES
          CALL_GRAPH             = NO
          CALLER_GRAPH           = NO
          DOT_TRANSPARENT        = YES
          DOT_GRAPH_MAX_NODES    = 200
          EOF

      - name: Run Doxygen
        run: doxygen Doxyfile

      - name: Upload HTML
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: docs/html
